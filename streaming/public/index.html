<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Streaming Demo</title>
    <style>
      body { max-width: 760px; margin: 40px auto; padding: 0 16px; font: 16px/1.5 system-ui, sans-serif; color: #17202a; }
      h1 { margin-bottom: 4px; }
      .hint { color: #52616b; margin-top: 0; }
      #chat { min-height: 220px; border: 1px solid #ccd3d8; border-radius: 10px; padding: 16px; margin: 20px 0; }
      .message { white-space: pre-wrap; margin: 0 0 14px; }
      .user { color: #174a7e; }
      .assistant { color: #17202a; }
      .error { color: #a12a2a; }
      form { display: flex; gap: 8px; }
      input { flex: 1; min-width: 0; padding: 10px; }
      button { padding: 10px 14px; }
      #status { color: #52616b; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <h1>AI Streaming Demo</h1>
    <p class="hint">A simulated answer streams from Node.js to this browser as SSE events.</p>
    <div id="chat" aria-live="polite"></div>
    <p id="status" role="status"></p>
    <form id="chat-form">
      <input id="prompt" maxlength="1000" autocomplete="off" placeholder="Ask something…" required>
      <button id="send" type="submit">Send</button>
      <button id="stop" type="button" disabled>Stop</button>
    </form>
    <script type="module" src="/app.js"></script>
  </body>
</html>
